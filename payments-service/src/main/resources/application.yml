server:
  port: ${PORT:8081}

spring:
  application:
    name: payments-service
  datasource:
    url: ${PAYMENTS_DB_URL:jdbc:h2:mem:payments}
    username: ${PAYMENTS_DB_USER:sa}
    password: ${PAYMENTS_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

services:
  risk:
    url: ${RISK_SERVICE_URL:http://localhost:8084}
  ledger:
    url: ${LEDGER_SERVICE_URL:http://localhost:8082}
  partner:
    url: ${PARTNER_SERVICE_URL:http://localhost:8085}
