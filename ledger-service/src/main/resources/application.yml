server:
  port: ${PORT:8082}

spring:
  application:
    name: ledger-service
  datasource:
    url: ${LEDGER_DB_URL:jdbc:h2:mem:ledger}
    username: ${LEDGER_DB_USER:sa}
    password: ${LEDGER_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

ledger:
  fee-bps: ${PLATFORM_FEE_BPS:200}
