server:
  port: ${PORT:8083}

spring:
  application:
    name: settlement-service
  datasource:
    url: ${SETTLEMENT_DB_URL:jdbc:h2:mem:settlement}
    username: ${SETTLEMENT_DB_USER:sa}
    password: ${SETTLEMENT_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

settlement:
  cron: ${SETTLEMENT_CRON:0 0 2 * * *}

services:
  ledger:
    url: ${LEDGER_SERVICE_URL:http://localhost:8082}
  payments:
    url: ${PAYMENTS_SERVICE_URL:http://localhost:8081}
  partner:
    url: ${PARTNER_SERVICE_URL:http://localhost:8085}
