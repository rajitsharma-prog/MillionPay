<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Secure checkout | PayGate</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="checkout-body">
<div class="checkout-shell">

    <div class="checkout-brand">
        <span class="brand-mark">P</span>
        <span>Pay<span class="brand-accent">Gate</span></span>
    </div>

    <div class="checkout-card">

        <div class="alert alert-error" th:if="${error}" th:text="${error}">Error message</div>

        <p class="checkout-merchant"
           th:text="${merchantName != null} ? ${merchantName} : 'Merchant'">Merchant</p>

        <p class="checkout-amount">
            <span th:text="${payment['currency']}">INR</span>
            <span th:text="${#numbers.formatDecimal(payment['amount'] / 100.0, 1, 'COMMA', 2, 'POINT')}">0.00</span>
        </p>

        <p class="checkout-description"
           th:text="${payment['description'] != null and !#strings.isEmpty(payment['description'])} ? ${payment['description']} : 'Payment'">Payment description</p>

        <form method="post"
              th:action="@{/checkout/{id}(id=${payment['id']})}"
              autocomplete="on">

            <div class="form-group">
                <label for="cardholderName">Cardholder name</label>
                <input type="text"
                       id="cardholderName"
                       name="cardholderName"
                       required
                       maxlength="80"
                       placeholder="Name on card"
                       autocomplete="cc-name">
            </div>

            <div class="form-group">
                <label for="cardNumber">Card number</label>
                <input type="text"
                       id="cardNumber"
                       name="cardNumber"
                       required
                       inputmode="numeric"
                       pattern="[0-9 ]{12,23}"
                       maxlength="23"
                       placeholder="4111 1111 1111 1111"
                       autocomplete="cc-number">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="expiry">Expiry</label>
                    <input type="text"
                           id="expiry"
                           name="expiry"
                           required
                           inputmode="numeric"
                           pattern="(0[1-9]|1[0-2])\s?/\s?[0-9]{2,4}"
                           maxlength="9"
                           placeholder="MM/YY"
                           autocomplete="cc-exp">
                </div>
                <div class="form-group">
                    <label for="cvv">CVV</label>
                    <input type="password"
                           id="cvv"
                           name="cvv"
                           required
                           inputmode="numeric"
                           pattern="[0-9]{3,4}"
                           maxlength="4"
                           placeholder="123"
                           autocomplete="cc-csc">
                </div>
            </div>

            <button type="submit" class="btn btn-block">
                <span>Pay</span>
                <span th:text="${payment['currency']}">INR</span>
                <span th:text="${#numbers.formatDecimal(payment['amount'] / 100.0, 1, 'COMMA', 2, 'POINT')}">0.00</span>
            </button>
        </form>

        <p class="checkout-secure">Payments are encrypted. Card details are never stored.</p>
    </div>

    <p class="checkout-footer">
        Powered by PayGate &middot;
        <span th:text="${@environment.getProperty('portal.environment-label', 'Sandbox')}">Sandbox</span>
    </p>
</div>
</body>

</html>
